<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>timesync</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
<style>
.hide-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
.hide-scroll::-webkit-scrollbar-track { background: #f8fafc; }
.hide-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
.hide-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
[v-cloak] { display: none; }
body { margin: 0; padding: 0; }
</style>
</head>
<body class="sm:p-8 bg-gray-50 flex justify-center items-center min-h-screen">
<div id="app" v-cloak class="flex flex-col w-full sm:max-w-5xl h-screen sm:h-[calc(100vh-4rem)] bg-white sm:border border-gray-200 sm:rounded-xl shadow-sm">
<!-- Header & Controls -->
<header class="bg-white border-b border-gray-200 p-2 sm:p-4 shrink-0 z-20 flex flex-col md:flex-row gap-2 sm:gap-4 items-center justify-between sm:rounded-t-xl">
<h1 class="text-base sm:text-xl font-bold text-indigo-600 flex items-center gap-1.5 sm:gap-2">
<svg class="w-4 h-4 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
timesync
</h1>
<div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
<!-- Date Picker -->
<div class="flex items-center gap-1.5 bg-gray-50 p-1 rounded border border-gray-200 w-full sm:w-auto">
<label class="text-xs sm:text-sm font-medium text-gray-600 pl-1 shrink-0">Date:</label>
<input type="date" v-model="selectedDate" class="bg-white flex-1 border border-gray-300 rounded px-1.5 py-1 text-xs sm:text-sm">
</div>
<!-- Sort Button -->
<button @click="sortTimezones" class="flex items-center justify-center gap-1 bg-white border border-gray-300 rounded px-2 py-1 text-xs sm:text-sm hover:bg-gray-50">
<svg class="w-3.5 h-3.5 transition-transform" :class="{'rotate-180': !sortDescending}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12" /></svg>
Sort by Time
</button>
<!-- Searchable Custom Dropdown -->
<div class="flex items-center gap-1.5 bg-gray-50 p-1 rounded border border-gray-200 flex-1 sm:flex-none">
<div class="relative flex-1 sm:w-48">
<input type="text" v-model="searchQuery" @focus="searchOpen = true" placeholder="Type city to add..." class="bg-white border border-gray-300 rounded px-2 py-1 text-xs sm:text-sm outline-none w-full">
<div v-if="searchOpen && filteredTimezones.length > 0" class="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded shadow-lg z-50 max-h-48 overflow-y-auto">
<div v-for="tz in filteredTimezones" :key="tz" @click="selectTimezone(tz)" class="px-2 py-1.5 text-xs sm:text-sm hover:bg-indigo-50 cursor-pointer border-b border-gray-100">
{{ formatTzName(tz) }} <span class="text-[10px] text-gray-400">({{tz.split('/')[0]}})</span>
</div>
</div>
<div v-else-if="searchOpen && searchQuery !== ''" class="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded shadow-lg z-50 p-2 text-xs text-gray-500 text-center">
No city found.
</div>
</div>
</div>
</div>
</header>
<!-- Main Grid Area -->
<main class="flex-1 overflow-auto hide-scroll bg-gray-100 relative sm:rounded-b-xl">
<div class="inline-flex sm:flex gap-0 sm:gap-4 min-w-full sm:justify-center sm:p-4 pb-10 sm:pb-4">
<!-- Timezone Columns -->
<div v-for="tz in timezones" :key="tz" class="w-[25vw] min-w-[25vw] sm:min-w-0 sm:w-40 shrink-0 flex flex-col bg-white sm:rounded-lg sm:shadow-sm">
<!-- Persistent Column Header -->
<div class="p-1.5 sm:p-2 bg-gray-100 border-b border-gray-200 text-center sticky top-0 z-10 shrink-0 sm:rounded-t-lg">
<div class="font-bold text-[10px] sm:text-sm text-gray-800 truncate leading-tight" :title="tz">{{ formatTzName(tz) }}</div>
<div class="text-xs text-gray-500 mt-0.5 h-3 sm:h-4 flex items-center justify-center">
<span v-if="mainTimezone === tz" class="bg-indigo-100 text-indigo-700 px-1 py-[1px] rounded-full text-[9px] font-bold">Main</span>
</div>
<!-- Compact Actions -->
<div class="flex flex-col sm:flex-row justify-center gap-0.5 sm:gap-2 mt-1 sm:mt-2 h-6 sm:h-4">
<button v-if="mainTimezone !== tz" @click="mainTimezone = tz" class="text-[9px] sm:text-[10px] text-indigo-600 hover:underline">Make Main</button>
<button v-if="timezones.length > 1" @click="removeTimezone(tz)" class="text-[9px] sm:text-[10px] text-red-500 hover:underline">Drop</button>
</div>
</div>
<!-- Column Hours Wrapper -->
<div class="flex flex-col flex-1 bg-white sm:rounded-b-lg overflow-hidden">
<div v-for="hourData in getHoursData(tz)" :key="hourData.iso" @click="toggleHighlight(hourData.index)" class="h-10 sm:h-12 border-b border-gray-50 flex flex-col justify-center items-center transition-colors cursor-pointer" :class="{
'bg-emerald-100 border-y-emerald-300 shadow-[inset_0_0_12px_rgba(16,185,129,0.15)] z-10': selectedHourIndex === hourData.index,
'bg-amber-100 shadow-inner border-y-amber-200': hourData.isCurrentHour && selectedHourIndex !== hourData.index
}">
<!-- Time Text -->
<span class="text-[13px] sm:text-base font-medium leading-none mt-1" :class="selectedHourIndex === hourData.index ? 'text-emerald-900' : 'text-gray-900'">
{{ hourData.time }}
</span>
<!-- Date Text -->
<span class="text-[8px] sm:text-[10px] leading-tight mt-0.5 mb-0.5" :class="selectedHourIndex === hourData.index ? 'text-emerald-700' : 'text-gray-500'">
{{ hourData.dateStr }}
</span>
</div>
</div>
</div>
</div>
</main>
</div>
<script>
const { DateTime } = luxon;
const app = Vue.createApp({
data() {
const defaultTzList = ['America/Los_Angeles', 'Europe/London', 'Asia/Hong_Kong', 'Asia/Seoul'];
const defaultMainTz = 'America/Los_Angeles';

let savedTimezones = defaultTzList;
let savedMain = defaultMainTz;

try {
const storedTz = localStorage.getItem('syncTimezones');
const storedMain = localStorage.getItem('syncMainTimezone');
if (storedTz) savedTimezones = JSON.parse(storedTz);
if (storedMain && savedTimezones.includes(storedMain)) savedMain = storedMain;
} catch (e) {
console.warn("Could not load from localStorage", e);
}

return {
selectedDate: DateTime.now().toFormat('yyyy-MM-dd'),
timezones: savedTimezones,
mainTimezone: savedMain,
availableTimezones: Intl.supportedValuesOf('timeZone'),
searchQuery: '',
searchOpen: false,
sortDescending: true,
selectedHourIndex: null 
}
},
computed: {
filteredTimezones() {
if (!this.searchQuery) return [];
const query = this.searchQuery.toLowerCase();
return this.availableTimezones.filter(tz => {
const cityName = this.formatTzName(tz).toLowerCase();
return cityName.includes(query) && !this.timezones.includes(tz);
}).slice(0, 8);
}
},
watch: {
timezones: {
handler(newVal) { localStorage.setItem('syncTimezones', JSON.stringify(newVal)); },
deep: true
},
mainTimezone(newVal) {
localStorage.setItem('syncMainTimezone', newVal);
},
selectedDate() {
this.selectedHourIndex = null;
}
},
mounted() {
this.handleUrlParams();
window.addEventListener('hashchange', this.handleUrlParams);
},
unmounted() {
window.removeEventListener('hashchange', this.handleUrlParams);
},
methods: {
handleUrlParams() {
let hash = window.location.hash.substring(1);
if (hash) {
const citiesToFind = hash.includes(',') ? hash.split(',') : hash.split('-');
const matchedTzs = [];
citiesToFind.forEach(q => {
const cleanQ = q.toLowerCase().replace(/[\+%20]/g, '').trim();
if (!cleanQ) return;
const match = this.availableTimezones.find(tz => {
const city = tz.split('/').pop().toLowerCase().replace(/_/g, '');
return city === cleanQ || city.includes(cleanQ);
});
if (match && !matchedTzs.includes(match)) {
matchedTzs.push(match);
}
});
if (matchedTzs.length > 0) {
this.timezones = matchedTzs;
if (!this.timezones.includes(this.mainTimezone)) {
this.mainTimezone = matchedTzs[0];
}
}
}
},
selectTimezone(tz) {
if (!this.timezones.includes(tz)) {
this.timezones.push(tz);
this.searchQuery = '';
}
this.searchOpen = false;
},
removeTimezone(tz) {
this.timezones = this.timezones.filter(t => t !== tz);
if (this.mainTimezone === tz && this.timezones.length > 0) {
this.mainTimezone = this.timezones[0];
}
},
sortTimezones() {
this.timezones.sort((a, b) => {
const offsetA = DateTime.now().setZone(a).offset;
const offsetB = DateTime.now().setZone(b).offset;
return this.sortDescending ? offsetB - offsetA : offsetA - offsetB;
});
this.sortDescending = !this.sortDescending;
},
formatTzName(tz) {
const parts = tz.split('/');
return (parts[parts.length - 1] || tz).replace(/_/g, ' ');
},
toggleHighlight(index) {
this.selectedHourIndex = this.selectedHourIndex === index ? null : index;
},
getHoursData(targetTz) {
const hours = [];
const [year, month, day] = this.selectedDate.split('-').map(Number);
const nowMain = DateTime.now().setZone(this.mainTimezone);
const isToday = this.selectedDate === nowMain.toFormat('yyyy-MM-dd');
const currentMainHour = nowMain.hour;

for (let i = 0; i < 24; i++) {
const mainHourDt = DateTime.fromObject({ year, month, day, hour: i }, { zone: this.mainTimezone });
const targetDt = mainHourDt.setZone(targetTz);
hours.push({
index: i,
iso: targetDt.toISO(),
time: targetDt.toFormat('HH:mm'),
dateStr: targetDt.toFormat('MMM d'),
isCurrentHour: isToday && i === currentMainHour,
isToday: isToday
});
}
return hours;
}
}
});
app.mount('#app');
</script>
</body>
</html>
